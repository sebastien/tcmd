<section class="help" when="open" role="dialog" aria-modal="true" aria-label="Key reference" tabindex="-1" on:click="!dialog:help-cancel">
	<div class="help-dialog" on:click="dialogStop">
		<header out="title"></header>
		<div class="help-columns">
			<div class="help-column" out="leftRows"></div>
			<div class="help-column" out="rightRows"></div>
		</div>
		<footer class="help-footer">
			<span class="help-bracket" out="hintOpen"></span>
			<span class="help-title" out="hintHead"></span>
			<span class="help-key" out="hintKeys"></span>
			<span class="help-bracket" out="hintClose"></span>
		</footer>
	</div>
</section>
