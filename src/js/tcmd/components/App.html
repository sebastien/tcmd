	<div when="!desktopMode" out="headerView|Header"></div>
	<div class="desktop-toolbar" when="desktopMode" role="toolbar" aria-label="File browser">
		<div class="desktop-toolbar-group">
			<button class="desktop-toolbar-button is-primary" type="button" title="Open a folder" aria-label="Open a folder" on:click="!toolbar:open-folder"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-folder-plus"></use></svg><span>Open folder</span></button>
			<button class="desktop-toolbar-button" type="button" title="Go back" aria-label="Go back" on:click="!toolbar:back"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-arrow-left"></use></svg><span>Back</span></button>
			<button class="desktop-toolbar-button" type="button" title="Go forward" aria-label="Go forward" on:click="!toolbar:forward"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-arrow-right"></use></svg><span>Forward</span></button>
			<button class="desktop-toolbar-button" type="button" title="Go to the parent folder" aria-label="Go to the parent folder" on:click="!toolbar:up"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-arrow-up"></use></svg><span>Up</span></button>
			<button class="desktop-toolbar-button" type="button" title="Refresh the active folder" aria-label="Refresh the active folder" on:click="!toolbar:refresh"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-refresh-cw"></use></svg><span>Refresh</span></button>
		</div>
		<span class="desktop-toolbar-separator" aria-hidden="true"></span>
		<div class="desktop-toolbar-group">
			<button class="desktop-toolbar-button" type="button" title="Switch between Explorer and Commander" aria-label="Switch view mode" on:click="!toolbar:toggle-mode"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-columns-2"></use></svg><span out="desktopViewLabel"></span></button>
			<button class="desktop-toolbar-button" type="button" title="Toggle the preview pane" aria-label="Toggle the preview pane" on:click="!toolbar:toggle-preview"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-panel-right"></use></svg><span out="desktopPreviewLabel"></span></button>
		</div>
		<span class="desktop-toolbar-spacer"></span>
		<div class="desktop-toolbar-group">
			<button class="desktop-toolbar-button" type="button" title="Open the command panel" aria-label="Open the command panel" on:click="!toolbar:commands"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-terminal"></use></svg><span>Commands</span><svg class="toolbar-chevron ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-chevron-right"></use></svg></button>
			<button class="desktop-toolbar-button" type="button" title="Show keyboard shortcuts" aria-label="Show keyboard shortcuts" on:click="!toolbar:help"><svg class="toolbar-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-circle-question-mark"></use></svg><span>Help</span></button>
		</div>
	</div>
	<section class="resize-hint" when="tooSmall">
		<h2 out="minSizeTitle"></h2>
		<p out="minSizeHint"></p>
	</section>
	<main class="panes" when="!tooSmall">
		<section class="pane pane-parent" when="showParentPane" out:class="parentPaneClass" on:click="parentId!pane:activate">
			<div class="pane-header">
				<div when="!parentFilterOn" out="parentCrumbsView|Breadcrumbs"></div>
				<div out="parentFilterView|FilterBar"></div>
			</div>
			<div data-slot="list" out="parentListView|FileList"></div>
			<div out="parentDetailView|EntryDetail"></div>
		</section>
		<section class="pane pane-left" when="showLeftPane" out:class="leftPaneClass" on:click="leftId!pane:activate">
			<div class="pane-header">
				<div when="!leftFilterOn" out="leftCrumbsView|Breadcrumbs"></div>
				<div out="leftFilterView|FilterBar"></div>
			</div>
			<div data-slot="list" out="leftListView|FileList"></div>
			<div out="leftDetailView|EntryDetail"></div>
		</section>
		<section class="pane pane-right" when="showRightPane" out:class="rightPaneClass" on:click="rightId!pane:activate">
			<div class="pane-header">
				<div when="!rightFilterOn" out="rightCrumbsView|Breadcrumbs"></div>
				<div out="rightFilterView|FilterBar"></div>
			</div>
			<div data-slot="list" out="rightListView|FileList"></div>
			<div out="rightDetailView|EntryDetail"></div>
		</section>
		<div data-slot="inspector" when="showInspectorInline" out="previewView|FilePreview"></div>
		<div class="preview-max" when="showPreviewFull" out="previewView|FilePreview"></div>
	</main>
	<div out="commandBarView|CommandBar"></div>
	<div class="viewer" when="showViewer" role="dialog" aria-modal="true" aria-label="File inspector" tabindex="-1" on:click="!dialog:viewer-cancel" out="previewView|FilePreview"></div>
	<div when="panelOpen" out="panelView|CommandPanel"></div>
	<div when="bookmarkOpen" out="bookmarkView|BookmarkList"></div>
	<div when="overlayOpen" out="overlayView|OverlayList"></div>
	<div out="confirmView|Confirm"></div>
	<div when="helpOpen" out="helpView|Help"></div>
</div>
