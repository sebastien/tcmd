<div class="panel-picker-pane" when="open" aria-label="File picker">
	<div class="panel-picker">
		<label class="panel-picker-line">
			<svg class="panel-picker-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-folder-open"></use></svg>
			<input class="panel-picker-path" type="text" inout="path" aria-label="Path" spellcheck="false" autocomplete="off" />
		</label>
	</div>
	<ul class="panel-args panel-picker-rows" aria-label="Picker entries" out="rows"></ul>
	<p class="panel-args-empty" when="empty" out="emptyText"></p>
</div>
