<span class="panel-field" out:class="fieldClass" out:data-focused="focused" on:click="item.argIndex!panel:field">
	<span class="panel-field-name" out="name"></span>
	<input class="panel-value" when="editing" type="text" inout="value" aria-label="Argument value" />
	<span class="panel-field-value" when="!editing" out="text"></span>
</span>
