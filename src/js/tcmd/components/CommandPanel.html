<section class="command-panel" when="open" role="dialog" aria-modal="true" aria-label="Command panel" tabindex="-1" on:click="!dialog:panel-cancel">
	<div class="command-dialog" on:click="dialogStop">
		<header class="panel-title" out="title"></header>
		<button class="panel-close" type="button" tabindex="-1" aria-label="Close command panel" on:click="!panel:close." out="closeHint"></button>
		<div class="panel-columns">
			<div class="panel-command-column">
				<label class="panel-query-line">
					<span out="sign"></span>
					<input class="panel-query" type="text" inout="query" aria-label="Filter commands" />
				</label>
				<ul class="panel-ops" aria-label="Commands" out="opRows"></ul>
			</div>
			<div class="panel-args-column">
				<p class="panel-command-name" out="commandName"></p>
				<div when="picking" out="pickerView|FilePicker"></div>
				<div class="panel-args-scroll" when="!picking">
					<ul class="panel-args" aria-label="Arguments" out="argRows"></ul>
					<pre class="panel-preview" when="hasPreview" out="preview"></pre>
					<ul class="panel-run-action" aria-label="Run command" out="runRows"></ul>
					<div class="panel-run-error-block" when="hasRunError">
						<p out="runError"></p>
					</div>
					<p class="panel-confirm-command" when="hasConfirmCommand" out="confirmCommand" out:data-risk="confirmRisk"></p>
				</div>
			</div>
		</div>
		<footer out="footer"></footer>
	</div>
</section>
