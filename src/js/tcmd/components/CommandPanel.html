<section class="command-panel" when="open" role="dialog" aria-modal="true" aria-label="Command panel" tabindex="-1" on:click="!dialog:panel-cancel">
	<div class="command-dialog" on:click="dialogStop">
		<header out="title"></header>
		<div class="panel-columns">
			<div class="panel-command-column">
				<label class="panel-query-line">
					<span out="sign"></span>
					<input class="panel-query" type="text" inout="query" aria-label="Filter commands" />
				</label>
				<ul class="panel-ops" aria-label="Commands" out="opRows"></ul>
			</div>
			<div class="panel-args-column">
				<p class="panel-command-name" out="commandName"></p>
				<div class="panel-picker-pane" when="picking">
					<div class="panel-picker">
						<p class="panel-picker-path" out="pickerPath"></p>
						<label class="panel-picker-line">
							<svg class="panel-picker-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-search"></use></svg>
							<input class="panel-picker-query" type="text" inout="pickerQuery" aria-label="Filter entries" />
						</label>
					</div>
					<ul class="panel-args panel-picker-rows" aria-label="Picker entries" out="argRows"></ul>
					<p class="panel-args-empty" when="pickerEmpty" out="pickerEmptyText"></p>
				</div>
				<p class="panel-args-empty" when="argsEmpty" out="argsEmptyText"></p>
				<ul class="panel-args" when="!picking" aria-label="Arguments" out="argRows"></ul>
				<pre class="panel-preview" when="hasPreview" out="preview"></pre>
				<ul class="panel-run-action" when="!picking" aria-label="Run command" out="runRows"></ul>
			</div>
		</div>
		<footer out="footer"></footer>
	</div>
</section>
