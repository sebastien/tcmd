<li class="panel-row" out:class="rowClass" out:data-risk="row.risk" out:data-group="row.group" out:data-type="row.type" out:data-selected="rowSelected" on:click="row.key!panel:select">
	<span class="panel-list-indent" when="isList" out="listSpacer"></span>
	<span class="panel-list-box" when="isList">
		<span class="panel-marker" when="isItem" out="marker"></span>
		<span class="panel-name" when="isItem" out="name"></span>
		<span class="panel-summary" when="isItem" out="summary"></span>
	</span>
	<span class="panel-name panel-group-name" when="isGroup" out="name"></span>
	<span class="panel-marker" when="showPlain" out="marker"></span>
	<span class="panel-name" when="showPlain" out="name"></span>
	<span class="panel-marker" when="isArg" out="marker"></span>
	<span class="panel-name panel-arg-name" when="isArg" out="name"></span>
	<span class="panel-perm" when="isPerm">
		<span class="panel-perm-class" out="permClass"></span>
		<button class="panel-perm-bit" type="button" tabindex="-1" out:class="permRClass" out:aria-pressed="permROn" on:click="row.keyR!panel:perm." out="permR"></button>
		<button class="panel-perm-bit" type="button" tabindex="-1" out:class="permWClass" out:aria-pressed="permWOn" on:click="row.keyW!panel:perm." out="permW"></button>
		<button class="panel-perm-bit" type="button" tabindex="-1" out:class="permXClass" out:aria-pressed="permXOn" on:click="row.keyX!panel:perm." out="permX"></button>
	</span>
	<button class="panel-run-button" when="isRun" type="button" tabindex="-1" out:aria-label="runAriaLabel" out="runLabel"></button>
	<span class="panel-field" when="isArg" out:data-editable="editable">
		<span class="panel-field-bracket" out="fieldOpen"></span>
		<input class="panel-value" when="editing" type="text" inout="value" aria-label="Argument value" />
		<span class="panel-field-value" when="!editing" out="summary"></span>
		<span class="panel-field-bracket" out="fieldClose"></span>
	</span>
	<span class="panel-summary" when="isPlain" out="summary"></span>
	<svg class="panel-op-chevron ui-icon" when="isOp" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#lucide-chevron-right"></use></svg>
</li>
