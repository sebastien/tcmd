<div class="bookmark-list" when="open" role="dialog" aria-modal="true" aria-label="Bookmarks" on:click="!dialog:bookmark-cancel">
	<div class="bookmark-dialog" on:click="dialogStop">
		<h2 out="title"></h2>
		<header>
			<span class="bookmark-sign" out="sign"></span>
			<input class="bookmark-query" type="text" inout="query" aria-label="Filter bookmarks" on:enter="confirm">
		</header>
		<p class="bookmark-empty" when="emptyList" out="empty"></p>
		<ul class="bookmark-rows" out="rows"></ul>
		<footer out="footer"></footer>
	</div>
</div>
